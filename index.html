<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Ngô Thu Hằng - Chúc Mừng Ngày 20/10 & Đỗ Cấp 3!</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #ff6b8b;
            --primary-dark: #d81b60;
            --accent: #ff8eaf;
            --bg-start: #fff0f3;
            --bg-end: #ffe3e8;
            --text-color: #4a3e43;
            --gold: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
        }

        /* Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Layout Container */
        .app-container {
            position: relative;
            z-index: 2;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeInDown 1s ease-out;
        }

        .badge-date {
            display: inline-block;
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary-dark);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.2);
            backdrop-filter: blur(5px);
            margin-bottom: 12px;
            border: 1px solid rgba(255, 182, 193, 0.6);
        }

        h1.main-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.9rem;
            color: var(--primary-dark);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .sub-title {
            font-size: 1.05rem;
            color: #7a616c;
            font-weight: 500;
        }

        /* Envelope */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 20px 0;
            cursor: pointer;
        }

        .envelope {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.15);
            padding: 38px 25px;
            text-align: center;
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.3s;
            border: 2px solid #fff0f3;
        }

        .envelope:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.22);
        }

        .envelope-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff8eaf, #ff6b8b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 2.2rem;
            box-shadow: 0 8px 20px rgba(255, 107, 139, 0.35);
            animation: pulseHeart 1.8s infinite;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .envelope-to {
            font-size: 0.95rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .envelope-name {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
        }

        .click-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff0f3;
            color: var(--primary-dark);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Modal Card */
        .card-modal {
            display: none;
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(216, 27, 96, 0.18);
            border: 2px solid #ffffff;
            animation: zoomIn 0.5s ease forwards;
        }

        .letter-header {
            text-align: center;
            border-bottom: 2px dashed #ffd1dc;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .letter-header h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--primary-dark);
        }

        .letter-body {
            font-size: 1.05rem;
            line-height: 1.85;
            color: #3a2e33;
            text-align: justify;
            margin-bottom: 25px;
        }

        .letter-body p {
            margin-bottom: 15px;
            text-indent: 24px;
        }

        .letter-footer {
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--primary-dark);
            font-weight: bold;
            margin-top: 20px;
        }

        /* Mini Game Section */
        .interactive-section {
            margin-top: 25px;
            border-top: 2px dashed #ffd1dc;
            padding-top: 20px;
            text-align: center;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 14px;
        }

        .btn-draw {
            background: linear-gradient(135deg, #ff6b8b, #d81b60);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(216, 27, 96, 0.28);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(216, 27, 96, 0.38);
        }

        .wish-box {
            display: none;
            margin-top: 18px;
            background: #fff5f7;
            border: 2px solid #ffb6c1;
            padding: 18px 20px;
            border-radius: 16px;
            color: #d81b60;
            font-size: 1.08rem;
            font-weight: 600;
            line-height: 1.6;
            animation: fadeIn 0.4s ease;
        }

        /* Music Control Button */
        .audio-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 52px;
            height: 52px;
            background: #ffffff;
            color: var(--primary-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            z-index: 10;
            border: 2px solid #ffe3e8;
            transition: all 0.3s;
        }

        .audio-btn.playing {
            animation: spin 5s linear infinite;
            background: #ff6b8b;
            color: white;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.88rem;
            color: #888;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1.main-title { font-size: 2.1rem; }
            .envelope-name { font-size: 2.5rem; }
            .card-modal { padding: 25px 20px; }
            .letter-header h2 { font-size: 2rem; }
            .letter-body { font-size: 0.98rem; text-align: left; }
        }
    </style>
</head>
<body>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Audio Element (Nhạc Lofi / Chill nhẹ nhàng giải tỏa căng thẳng) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <div class="app-container">
        
        <header>
            <div class="badge-date"><i class="fa-solid fa-graduation-cap"></i> 20 THÁNG 10</div>
            <h1 class="main-title">Chúc Mừng Ngày Phụ Nữ Việt Nam</h1>
            <p class="sub-title">Món quà nhỏ gửi tặng em gái Ngô Thu Hằng</p>
        </header>

        <!-- Envelope -->
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openCard()">
            <div class="envelope">
                <div class="envelope-icon">
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>
                <div class="envelope-to">Thư chúc mừng gửi em gái:</div>
                <div class="envelope-name">Ngô Thu Hằng
